<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Présence — Application</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'">
    <style>
      :root { --bg:#f5f7fb; --card:#fff; --accent:#1f6feb; --danger:#e02424; --muted:#6b7280; }
      body { font-family: Inter, Arial, sans-serif; background: var(--bg); margin:0; display:flex; align-items:center; justify-content:center; height:100vh; }
      .card { background: var(--card); padding:24px; border-radius:12px; width:420px; box-shadow: 0 6px 20px rgba(16,24,40,0.08); }
      h1,h2 { margin:0 0 16px 0; color:#0f172a; }
      input { width:100%; padding:10px 12px; margin-bottom:12px; border-radius:8px; border:1px solid #e6e9ef; }
      button { background:var(--accent); color:white; border:none; padding:10px 14px; border-radius:8px; cursor:pointer; }
      button.secondary { background:transparent; color:var(--accent); border:1px solid #e6e9ef; }
      .muted { color:var(--muted); font-size:13px; }
      .row { display:flex; gap:8px; }
      .qr { text-align:center; margin:12px 0; }
      .small { font-size:13px; color:var(--muted); }
      .danger { color:var(--danger); }
      .hidden { display:none; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Présence</h1>

      <!-- Register -->
      <div id="register">
        <h2>Créer un compte</h2>
        <input id="reg_user" placeholder="Nom d'utilisateur" />
        <input id="reg_pass" type="password" placeholder="Mot de passe (min 8 caractères)" />
        <div class="row">
          <button id="btnRegister">S'inscrire</button>
          <button class="secondary" id="btnShowLogin">J'ai déjà un compte</button>
        </div>
        <p id="reg_msg" class="small"></p>
      </div>

      <!-- Login -->
      <div id="login" class="hidden">
        <h2>Connexion</h2>
        <input id="username" placeholder="Nom d'utilisateur" />
        <input id="password" type="password" placeholder="Mot de passe" />
        <div class="row">
          <button id="btnLogin">Se connecter</button>
          <button class="secondary" id="btnShowRegister">Créer un compte</button>
        </div>
        <p id="msg" class="small"></p>
      </div>

      <!-- 2FA required -->
      <div id="twofa_section" class="hidden">
        <h2>Vérification 2FA</h2>
        <p class="small">Saisissez le code reçu (application TOTP ou Discord selon votre configuration).</p>
        <input id="twofa_code" placeholder="Code 2FA (6 chiffres)" />
        <div class="row">
          <button id="btnVerify2FA">Vérifier</button>
          <button class="secondary" id="btnCancel2FA">Annuler</button>
        </div>
        <p id="twofa_msg" class="small"></p>
      </div>

      <!-- Main after login -->
      <div id="main" class="hidden">
        <h2 id="welcome">Bienvenue</h2>
        <div class="row">
          <button id="btnConfirm">Confirmer présence</button>
          <button class="secondary" id="btnLogout">Se déconnecter</button>
        </div>
        <p id="status" class="small"></p>

        <hr style="margin:12px 0">

        <h3>Sécurité du compte</h3>
        <p class="small">Configurer la 2FA pour renforcer la sécurité.</p>
        <div id="setup2fa" class="">
          <div class="row">
            <button id="btnSetupTOTP">Activer 2FA (TOTP)</button>
            <button id="btnSetupDiscord">Activer 2FA (Code envoyé sur Discord)</button>
          </div>
          <div id="qr_block" class="hidden">
            <p class="small">Scannez ce QR avec votre application d'authentification:</p>
            <div id="qr" class="qr"></div>
            <input id="totp_code_input" placeholder="Code TOTP pour confirmer" />
            <div class="row">
              <button id="btnConfirmSetup">Confirmer activation</button>
              <button class="secondary" id="btnCancelSetup">Annuler</button>
            </div>
            <p id="setup_msg" class="small"></p>
          </div>
        </div>
      </div>

    </div>

    <script src="renderer.js"></script>
  </body>
</html>
